<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - LibraryHub</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="dashboard.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.default.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="page-container">
      
      <!-- PREMIUM SIDEBAR START -->
      <aside class="sidebar">
        <!-- Logo Section -->
        <div class="sidebar-header">
          <div class="logo-icon">
            <i data-lucide="book-open-check"></i>
          </div>
          <div class="logo-text">
            <span>Library</span><span class="highlight">Hub</span>
          </div>
        </div>

        <!-- Navigation Menu -->
        <nav class="sidebar-nav">
          <div class="nav-label">Main Menu</div>
          
          <button class="sidebar-btn active" data-section="dashboard">
            <i data-lucide="layout-grid"></i>
            <span>Dashboard</span>
            <div class="glow-effect"></div>
          </button>
          
          <button class="sidebar-btn" data-section="books">
            <i data-lucide="library"></i>
            <span>Books Inventory</span>
          </button>
          
          <button class="sidebar-btn" data-section="students">
            <i data-lucide="graduation-cap"></i>
            <span>Students</span>
          </button>
          
          <button class="sidebar-btn" data-section="checkouts">
            <i data-lucide="arrow-left-right"></i>
            <span>Checkouts</span>
          </button>
        </nav>

        <!-- Sidebar Footer / Profile -->
        <div class="sidebar-footer">
          <div class="user-profile">
            <div class="avatar">
              <img src="https://ui-avatars.com/api/?name=Admin+User&background=3b82f6&color=fff" alt="Admin" />
            </div>
            <div class="user-info">
              <span class="name">Admin User</span>
              <span class="role">Library Manager</span>
            </div>
            <button class="logout-mini-btn" id="logout-btn-sidebar">
              <i data-lucide="log-out" width="16"></i>
            </button>
          </div>
        </div>
      </aside>
      <!-- PREMIUM SIDEBAR END -->

      <div class="main-content">
        <header class="top-bar">
          <button class="menu-toggle">
            <i data-lucide="menu"></i>
          </button>
          <div class="search-container">
            <i data-lucide="search"></i>
            <input
              type="text"
              id="search-box"
              placeholder="Search books, students, or ISBN..."
            />
          </div>
          <div class="top-bar-actions">
            <!-- Mobile Logout (Hidden on Desktop usually, but kept for logic) -->
            <button class="action-btn" id="logout-btn">
              <i data-lucide="log-out"></i>
            </button>
          </div>
        </header>

        <main class="content-area">
          <div id="dashboard-section" class="content-section">
            <div class="dashboard-header">
              <h1>Overview</h1>
              <p>Welcome back, here is what's happening today.</p>
            </div>

            <div class="stats-grid">
              <div class="stat-card">
                <div class="card-content">
                  <p class="card-title">Total Books</p>
                  <p id="stats-total-books" class="card-value">0</p>
                  <p class="card-description">Total Collection</p>
                </div>
                <div class="card-icon-wrapper icon-total">
                  <i data-lucide="book"></i>
                </div>
              </div>
              <div class="stat-card">
                <div class="card-content">
                  <p class="card-title">Available</p>
                  <p id="stats-available-books" class="card-value">0</p>
                  <p class="card-description">On Shelves</p>
                </div>
                <div class="card-icon-wrapper icon-available">
                  <i data-lucide="check-circle"></i>
                </div>
              </div>
              <div class="stat-card">
                <div class="card-content">
                  <p class="card-title">Borrowed</p>
                  <p id="stats-checked-out" class="card-value">0</p>
                  <p class="card-description">With Students</p>
                </div>
                <div class="card-icon-wrapper icon-checked-out">
                  <i data-lucide="clock"></i>
                </div>
              </div>
              <div class="stat-card">
                <div class="card-content">
                  <p class="card-title">Students</p>
                  <p id="stats-total-students" class="card-value">0</p>
                  <p class="card-description">Active Members</p>
                </div>
                <div class="card-icon-wrapper icon-students">
                  <i data-lucide="users"></i>
                </div>
              </div>
            </div>
          </div>
          <iframe
            id="content-frame"
            src="about:blank"
            style="display: none; border: none; width: 100%; height: 80vh"
          ></iframe>
        </main>
      </div>
    </div>

    <!-- Modal (Kept exactly same for logic to work) -->
    <div id="checkout-modal" class="modal-overlay" style="display: none">
      <div class="modal-content">
        <form id="checkout-form">
          <h3 id="checkout-modal-title">Check Out Book</h3>
          <p>
            You are checking out:
            <strong id="checkout-book-title">Book Title Here</strong>
          </p>

          <input type="hidden" id="checkout-book-id" name="book_id" />

          <div class="filter-section" style="background: #f8fafc; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #e2e8f0;">
            <label style="font-size: 0.85rem; color: #64748b; font-weight: 600; margin-bottom: 5px; display: block;">Filter Students (Optional)</label>
            <div style="display: flex; gap: 10px;">
                <select id="checkout-filter-year" style="flex: 1; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; background: white;">
                    <option value="">All Years</option>
                </select>
                <select id="checkout-filter-dept" style="flex: 1; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; background: white;">
                    <option value="">All Departments</option>
                </select>
            </div>
          </div>

          <div class="form-group">
            <label for="student-select">Select Student</label>
            <select
              id="student-select"
              name="admission_no"
              required
              placeholder="Type to search name, ID, or phone..."
            ></select>
          </div>

          <div class="form-group">
            <label for="due-date-select">Select Due Date</label>
            <input type="date" id="due-date-select" name="due_date" required />
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-primary" id="confirm-checkout-btn">
              Confirm Checkout
            </button>
            <button
              type="button"
              id="cancel-checkout-btn"
              class="btn-secondary"
            >
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
    <script type="module" src="dashboard.js"></script>
  </body>
</html>
