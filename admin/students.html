<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div id="students-section" class="content-section" style="display: block;">
        <div class="header-with-action">
            <h2>Manage Students</h2>
            <button id="add-student-btn" class="add-btn">
                <i data-lucide="plus"></i>
                <span>Add New Student</span>
            </button>
        </div>
        <div id="add-student-form-container" style="display: none;">
            <form id="add-student-form" class="add-form">
                <h3 id="student-form-title">Add a New Student</h3>
                <input type="hidden" name="student_id" id="edit-student-id">
                <div class="form-grid">
                    <input type="text" name="name" placeholder="Name" required>
                    <input type="text" name="admission_no" placeholder="Admission Number" required>
                    <input type="email" name="email" placeholder="Email" required>
                    <input type="text" name="department" placeholder="Department" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary" id="save-student-btn">Save Student</button>
                    <button type="button" id="cancel-add-student-btn" class="btn-secondary">Cancel</button>
                </div>
            </form>
        </div>

        <div class="student-list-container">
            <h3>All Students</h3>
            <div class="table-wrapper">
                <table id="students-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Admission Number</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="students-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons();</script>
    <script type="module" src="students.js"></script>
</body>
</html>
