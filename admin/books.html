<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Books</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="books.css">
</head>
<body>
    <div class="page-wrapper">
        <!-- Header Section -->
        <div class="page-header">
            <h2 class="page-title">Manage Books</h2>
            <button id="add-book-btn" class="btn-primary">
                <i data-lucide="plus"></i> Add New Book
            </button>
        </div>

        <!-- Books Table Card -->
        <div class="table-card">
            <div class="card-header">
                <h3>All Books</h3>
            </div>
            <div class="table-responsive">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th style="width: 25%;">TITLE</th>
                            <th style="width: 20%;">AUTHOR</th>
                            <th style="width: 15%;">ISBN</th>
                            <th style="width: 15%;">GENRE</th>
                            <th style="width: 15%;">AVAILABLE</th>
                            <th style="width: 10%; text-align: center;">ACTIONS</th>
                        </tr>
                    </thead>
                    <tbody id="books-table-body">
                        <!-- Rows will be injected here by JS -->
                        <tr>
                            <td colspan="6" class="loading-cell">Loading books...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Add/Edit Book Modal -->
    <div id="book-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <form id="book-form">
                <h3 id="modal-title">Add New Book</h3>
                <input type="hidden" name="id" id="book-id">
                
                <div class="form-group">
                    <label>Book Title</label>
                    <input type="text" name="title" required placeholder="e.g. The Great Gatsby">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Author</label>
                        <input type="text" name="author" required placeholder="e.g. F. Scott Fitzgerald">
                    </div>
                    <div class="form-group">
                        <label>Genre</label>
                        <input type="text" name="genre" placeholder="e.g. Classic">
                    </div>
                </div>

                <div class="form-group">
                    <label>ISBN</label>
                    <input type="text" name="isbn" placeholder="e.g. 9780743273565">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Total Copies</label>
                        <input type="number" name="total_copies" id="total_copies" required min="1" value="1">
                    </div>
                    <div class="form-group">
                        <label>Available</label>
                        <input type="number" name="available_copies" id="available_copies" required min="0" value="1">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary" id="save-btn">Save Book</button>
                    <button type="button" id="cancel-btn" class="btn-secondary">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons();</script>
    <script type="module" src="books.js"></script>
</body>
</html>
