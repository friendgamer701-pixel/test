<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Portal | LibraryHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Global Styles (Must come first) -->
    <link rel="stylesheet" href="style.css" />
    <!-- Portal Specific Styles -->
    <link rel="stylesheet" href="find.css" />
  </head>
  <body>
    <!-- Updated Navbar to match style.css -->
    <nav class="navbar">
      <div class="container nav-wrapper">
        <a href="index.html" class="logo">
          <div class="logo-icon">
            <i data-lucide="library" width="24" height="24"></i>
          </div>
          <div class="logo-text">
            <span>Library</span><span class="highlight">Hub</span>
          </div>
        </a>
        <div class="nav-links">
          <!-- Changed to btn-primary so it is visible on white background -->
          <a href="index.html" class="btn btn-primary">
            <i data-lucide="arrow-left" width="18"></i> Back to Home
          </a>
        </div>
      </div>
    </nav>

    <!-- Search Hero -->
    <section class="search-hero">
      <div class="container">
        <h1 style="margin-bottom: 24px; color: #1e293b">Find Your Next Read</h1>
        <div class="search-container">
          <svg
            class="search-icon"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input
            type="text"
            id="public-search"
            class="search-input"
            placeholder="Search by book title, author, or ISBN..."
          />
        </div>
      </div>
    </section>

    <!-- Results Area -->
    <main class="container">
      <div id="results-grid" class="books-grid">
        <!-- Content will be injected by JS -->
        <div
          style="
            grid-column: 1/-1;
            text-align: center;
            color: #64748b;
            padding: 40px;
          "
        >
          Start typing to search for books...
        </div>
      </div>
    </main>

    <!-- Import Supabase & Icons -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Main Logic -->
    <script type="module" src="find.js"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
