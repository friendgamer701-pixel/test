<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LibraryHub - Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <div class="auth-page-wrapper">
      <div class="card">
        <a href="../index.html" class="back-button">
          <i data-lucide="chevron-left" width="20" height="20"></i>
          <span>Home</span>
        </a>

        <div class="card-header">
          <div class="logo login-brand-logo">
            <div class="logo-icon">
              <i data-lucide="library" width="24" height="24"></i>
            </div>
            <div class="logo-text">
              <span>Library</span><span class="highlight">Hub</span>
            </div>
          </div>
          
          <p class="card-description">
            Enter your email and password to continue
          </p>
        </div>

        <div class="card-content">
          <form class="auth-form">
            <div class="form-group">
              <label for="login-email" class="form-label">Email</label>
              <input
                type="email"
                id="login-email"
                placeholder="admin@libraryhub.com"
                class="form-input"
                required
              />
            </div>
            <div class="form-group">
              <label for="login-password" class="form-label">Password</label>
              <input
                type="password"
                id="login-password"
                placeholder="••••••••"
                class="form-input"
                required
              />
            </div>
            <button type="submit" class="btn btn-primary w-full">
              <span>Login</span>
            </button>
          </form>
        </div>
      </div>
    </div>
    
    <script>
      lucide.createIcons();
    </script>
    <script type="module" src="auth.js"></script>
  </body>
</html>
